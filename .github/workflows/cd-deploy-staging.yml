name: CD - Deploy Staging

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Deployment reason'
        required: false
        default: 'Manual staging deployment'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Calculate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.build_version.outputs.VERSION }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: '6.x'

      - name: Calculate version
        id: gv
        uses: gittools/actions/gitversion/execute@v3

      - name: Build version string
        id: build_version
        run: |
          BASE="${{ steps.gv.outputs.MajorMinorPatch }}-${{ steps.gv.outputs.PreReleaseLabel }}"
          N="${{ steps.gv.outputs.CommitsSinceVersionSource }}"
          VERSION="$BASE.$N"

          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Calculated version: $VERSION"

  build:
    name: Build & Test
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Configure NuGet authentication
        run: |
          dotnet nuget add source https://nuget.pkg.github.com/windischb/index.json \
            --name github \
            --username windischb \
            --password ${{ secrets.PERSONAL_PACKAGES_TOKEN }} \
            --store-password-in-clear-text

          dotnet nuget add source https://nuget.pkg.github.com/cocoar-dev/index.json \
            --name github_cocoar \
            --username windischb \
            --password ${{ secrets.PERSONAL_PACKAGES_TOKEN }} \
            --store-password-in-clear-text

      - name: Restore dependencies
        run: dotnet restore Cocoar.Shelf.slnx
        working-directory: ./src

      - name: Build
        run: dotnet build Cocoar.Shelf.slnx -c Release --no-restore -p:Version=${{ needs.version.outputs.version }}
        working-directory: ./src

      - name: Test
        run: dotnet test Cocoar.Shelf.slnx -c Release --no-build --verbosity normal
        working-directory: ./src

      - name: Publish
        run: dotnet publish Cocoar.Shelf/Cocoar.Shelf.csproj -c Release --no-build -o ../publish
        working-directory: ./src

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shelf-app
          path: ./publish

  deploy:
    name: Deploy to Staging
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: shelf-app
          path: ./docker/app

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=staging
            type=raw,value=develop
            type=raw,value=${{ needs.version.outputs.version }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./docker
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Deployment summary
        run: |
          echo "### Staging Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging\`" >> $GITHUB_STEP_SUMMARY
          echo "**Reason:** ${{ github.event.inputs.reason || 'Manual deployment' }}" >> $GITHUB_STEP_SUMMARY

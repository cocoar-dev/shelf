name: CD - Deploy Production

on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.id }}
  cancel-in-progress: true

jobs:
  validate-version:
    name: Validate & Extract Version
    if: github.event.release.target_commitish == 'develop'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - name: Extract and validate release version
        id: version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          echo "Release tag: $TAG"

          if [[ "$TAG" =~ ^v[0-9] ]]; then
            VERSION="${TAG#v}"
          else
            echo "::error ::Tag must start with 'v' followed by version number (e.g., v1.2.3)"
            exit 1
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error ::Invalid release version format. Expected X.Y.Z (e.g., 1.2.3), got: $VERSION"
            exit 1
          fi

          echo "Using release version: $VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

  build:
    name: Build & Test
    needs: validate-version
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Configure NuGet authentication
        run: |
          dotnet nuget add source https://nuget.pkg.github.com/windischb/index.json \
            --name github \
            --username windischb \
            --password ${{ secrets.PERSONAL_PACKAGES_TOKEN }} \
            --store-password-in-clear-text

          dotnet nuget add source https://nuget.pkg.github.com/cocoar-dev/index.json \
            --name github_cocoar \
            --username windischb \
            --password ${{ secrets.PERSONAL_PACKAGES_TOKEN }} \
            --store-password-in-clear-text

      - name: Restore dependencies
        run: dotnet restore Cocoar.Shelf.slnx
        working-directory: ./src

      - name: Build
        run: dotnet build Cocoar.Shelf.slnx -c Release --no-restore -p:Version=${{ needs.validate-version.outputs.version }}
        working-directory: ./src

      - name: Test
        run: dotnet test Cocoar.Shelf.slnx -c Release --no-build --verbosity normal
        working-directory: ./src

      - name: Publish
        run: dotnet publish Cocoar.Shelf/Cocoar.Shelf.csproj -c Release --no-build -o ../publish
        working-directory: ./src

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shelf-app
          path: ./publish

  deploy:
    name: Deploy to Production
    needs: [validate-version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: shelf-app
          path: ./docker/app

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=production
            type=semver,pattern={{version}},value=${{ needs.validate-version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.validate-version.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.validate-version.outputs.version }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./docker
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Deployment summary
        run: |
          echo "### Production Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.validate-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Release:** ${{ github.event.release.name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "- \`latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`production\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ needs.validate-version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY

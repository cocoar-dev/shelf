name: CI - Develop

on:
  push:
    branches: [ develop ]

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Configure NuGet authentication
        run: |
          dotnet nuget add source https://nuget.pkg.github.com/windischb/index.json \
            --name github \
            --username windischb \
            --password ${{ secrets.PERSONAL_PACKAGES_TOKEN }} \
            --store-password-in-clear-text

          dotnet nuget add source https://nuget.pkg.github.com/cocoar-dev/index.json \
            --name github_cocoar \
            --username windischb \
            --password ${{ secrets.PERSONAL_PACKAGES_TOKEN }} \
            --store-password-in-clear-text

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: '6.x'

      - name: Calculate version
        id: gv
        uses: gittools/actions/gitversion/execute@v4

      - name: Log version
        run: echo "Building version ${{ steps.gv.outputs.SemVer }}"

      - name: Restore backend dependencies
        run: dotnet restore Cocoar.Shelf.slnx
        working-directory: ./src

      - name: Build backend
        run: dotnet build Cocoar.Shelf.slnx -c Release --no-restore -p:Version=${{ steps.gv.outputs.SemVer }}
        working-directory: ./src

      # Formatting gate — what `dotnet build` cannot check: whitespace layout and
      # IDE-style rules. Style pass gates at error severity only.
      - name: Verify formatting (whitespace)
        run: dotnet format Cocoar.Shelf.slnx whitespace --verify-no-changes
        working-directory: ./src

      - name: Verify formatting (style, hard tier)
        run: dotnet format Cocoar.Shelf.slnx style --verify-no-changes --severity error
        working-directory: ./src

      - name: Test backend
        run: dotnet test Cocoar.Shelf.slnx -c Release --no-build --verbosity normal
        working-directory: ./src

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@10.13.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./src/Cocoar.Shelf.Client

      - name: Build frontend
        run: pnpm build
        working-directory: ./src/Cocoar.Shelf.Client
